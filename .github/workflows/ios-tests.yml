name: iOS 測試（編譯 + 收費流程單元測試 ×5）

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'flutter_app/**'
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 選 iPhone 模擬器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda p:(p[0],p[1]["name"]))
          print(c[-1][1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: 編譯 App 並連跑 5 次單元測試
        run: |
          set -o pipefail
          xcodebuild test \
            -project CameraPPP.xcodeproj -scheme CameraPPP -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CameraPPPTests \
            -parallel-testing-enabled NO \
            -test-iterations 5 \
            -derivedDataPath build \
            -resultBundlePath results.xcresult \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*(SubscriptionConfig|FeatureAccess|TrialManager|CameraManager|MainContainerView|PaywallView|SettingsView)|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)"

      - name: 失敗時顯示錯誤
        if: failure()
        run: grep -E "error:|failed|FAILED" xcodebuild.log | head -80

      - name: 收費邏輯模擬測試
        if: always()
        run: python3 -I scripts/billing_logic_test.py

  ui-video:
    name: 畫面操作測試＋錄影
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: 選 iPhone 模擬器並設定
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
          c.sort(key=lambda p:(p[0],p[1]["name"]))
          print(c[-1][1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
      - name: 編譯
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project CameraPPP.xcodeproj -scheme CameraPPP -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | grep -E "error:|BUILD|TEST BUILD" || true
      - name: 開始錄影、執行畫面測試
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "CameraPPP.app" | head -1)
          xcrun simctl install "$UDID" "$APP"
          for p in camera microphone photos; do xcrun simctl privacy "$UDID" grant $p com.lin.energysaving || true; done
          xcrun simctl io "$UDID" recordVideo --codec h264 --force test-video.mov &
          REC=$!
          sleep 3
          set +e
          xcodebuild test-without-building -project CameraPPP.xcodeproj -scheme CameraPPP \
            -destination "id=$UDID" -derivedDataPath build \
            -only-testing:CameraPPPUITests/BillingFlowUITests -only-testing:CameraPPPUITests/AllFeaturesUITests -resultBundlePath ui.xcresult 2>&1 | tee ui.log | grep -E "STEP|FEAT|error|Executed|TEST "
          CODE=${PIPESTATUS[0]}
          sleep 2
          kill -INT $REC; wait $REC
          grep -E "STEP [0-9]|FEAT [0-9]" ui.log | sed -E 's/.*((STEP|FEAT) [0-9])/\1/' > steps.txt
          cat steps.txt
          mkdir -p shots
          xcrun xcresulttool export attachments --path ui.xcresult --output-path shots >/dev/null 2>&1 || true
          ls shots | head -40
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ui-test-video
          path: |
            test-video.mov
            steps.txt
            shots/
      - name: 報告推到 ui-test-report 分支
        run: |
          mkdir rep && cp test-video.mov steps.txt rep/ && (cp -r shots rep/ || true)
          cd rep && git init -q && git checkout -q -b ui-test-report && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "UI 測試報告 ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-test-report
