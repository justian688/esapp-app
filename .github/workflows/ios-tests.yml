name: iOS 測試（編譯 + 收費流程單元測試 ×5）

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'flutter_app/**'
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 選 iPhone 模擬器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda p:(p[0],p[1]["name"]))
          print(c[-1][1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: 編譯 App 並連跑 5 次單元測試
        run: |
          set -o pipefail
          xcodebuild test \
            -project CameraPPP.xcodeproj -scheme CameraPPP -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:CameraPPPTests \
            -parallel-testing-enabled NO \
            -test-iterations 5 \
            -derivedDataPath build \
            -resultBundlePath results.xcresult \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*(SubscriptionConfig|FeatureAccess|TrialManager|CameraManager|MainContainerView|PaywallView|SettingsView)|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)"

      - name: 失敗時顯示錯誤
        if: failure()
        run: grep -E "error:|failed|FAILED" xcodebuild.log | head -80

      - name: 收費邏輯模擬測試
        if: always()
        run: python3 -I scripts/billing_logic_test.py
